<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Reparto Pro</title>
  <style>
    :root {
      --bg: #F4F4F6;
      --card-bg: #FFFFFF;
      --text-main: #1C1C1E;
      --text-muted: #8E8E93;
      --accent: #007AFF;
      --success: #34C759;
      --warning: #FF9500;
      --danger: #FF3B30;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --btn-inner-light: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      
      /* Borde de la tarjeta foco en Modo Claro */
      --card-focus-border: 2.5px solid #007AFF;
      --card-focus-glow: 0 4px 16px rgba(0, 122, 255, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card-bg: #1C1C1E;
        --text-main: #F2F2F7;
        --text-muted: #98989D;
        --accent: #0A84FF;
        /* Verde más oscuro y apagado para no encandilar al volante de noche */
        --success: #1E6B34;
        --warning: #FFD60A;
        --danger: #FF453A;
        --border-subtle: rgba(255, 255, 255, 0.12);
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        --btn-inner-light: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        
        /* Borde Amarillo en Modo Oscuro */
        --card-focus-border: 2.5px solid #FFD60A;
        --card-focus-glow: 0 0 14px rgba(255, 214, 10, 0.25);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding: 18px; padding-bottom: 50px; }

    .container { max-width: 480px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }

    .config-box { background: var(--card-bg); padding: 12px; border-radius: 14px; margin-bottom: 16px; border: 1px solid var(--border-subtle); }
    .config-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-subtle); font-size: 15px; outline: none; background: transparent; color: var(--text-main); }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--card-shadow);
    }

    /* Tarjeta foco con borde dinámico (Azul de día / Amarillo de noche) */
    .card-current {
      border: var(--card-focus-border);
      box-shadow: var(--card-focus-glow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      box-shadow: var(--btn-inner-light), 0 4px 12px rgba(0, 0, 0, 0.12);
      transition: transform 0.1s ease, filter 0.1s ease;
      margin-bottom: 10px;
    }
    .btn:active { transform: scale(0.98); filter: brightness(0.92); }
    
    .btn-primary { background: var(--accent); color: #FFFFFF; }
    .btn-secondary { background: rgba(10, 132, 255, 0.15); color: var(--accent); box-shadow: none; border: 1px dashed var(--accent); }
    .btn-success { background: var(--success); color: #FFFFFF; }
    .btn-maps { background: #5856D6; color: #FFFFFF; }
    .btn-outline-danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
      box-shadow: none;
    }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }
    input[type="file"] { display: none; }

    /* Barra de Progreso */
    .progress-bar-container {
      display: none;
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
      text-align: center;
    }
    .progress-track { width: 100%; height: 8px; background: var(--border-subtle); border-radius: 4px; overflow: hidden; margin-top: 10px; }
    .progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }
    .progress-label { font-size: 14px; font-weight: 600; color: var(--accent); }

    .scan-status {
      display: none;
      background: rgba(10, 132, 255, 0.12);
      color: var(--accent);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 12px;
    }

    .summary-strip {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
      font-size: 14px;
      font-weight: 500;
    }
    .summary-strip strong { color: var(--accent); font-weight: 700; }

    .delivery-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(10, 132, 255, 0.12);
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    /* Número de paquete con ícono de caja sin la palabra "paquete" */
    .pkg-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .pkg-icon { width: 32px; height: 32px; fill: var(--accent); }
    .pkg-title { font-size: 44px; font-weight: 800; letter-spacing: -1.5px; color: var(--text-main); }

    .address-title { font-size: 22px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; color: var(--text-main); }
    .receiver-name { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; font-weight: 500; }

    .section-title { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stop-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .stop-row:last-child { border-bottom: none; }
    .stop-num { font-weight: 800; font-size: 17px; min-width: 48px; color: var(--accent); }
    .stop-info { flex: 1; }
    .stop-addr { font-weight: 600; font-size: 15px; }
    .stop-person { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Reparto Pro</h1>
  </div>

  <div class="config-box" id="apiKeySection">
    <input type="password" id="apiKeyInput" placeholder="Pegar Gemini API Key aquí" onchange="saveApiKey()" />
  </div>

  <div id="scanControls">
    <div id="scanStatus" class="scan-status">📄 0 hojas listas</div>

    <label class="btn btn-primary" id="addPhotoBtn">
      <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
      <span id="btnPhotoText">📷 Tomar Foto a la Hoja</span>
      <input type="file" accept="image/*" capture="environment" onchange="agregarHoja(event)" />
    </label>

    <button class="btn btn-success" id="btnProcessAll" style="display: none;" onclick="procesarTodasLasHojas()">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      🚀 Armar Ruta Óptima
    </button>
  </div>

  <div id="progressWrapper" class="progress-bar-container">
    <div id="progressLabel" class="progress-label">Iniciando lectura...</div>
    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <div id="summaryStrip" class="summary-strip">
    <div>Progreso: <strong id="sumProgress">0/0</strong></div>
    <div>Cierre est.: <strong id="sumEta">--:--</strong></div>
  </div>

  <a id="btnAllMaps" class="btn btn-maps" target="_blank" style="display: none;">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
    Ruta General en Maps
  </a>

  <!-- Tarjeta Entrega Actual (Borde Azul de día / Amarillo de noche) -->
  <div id="currentCard" class="card card-current" style="display: none;">
    <div class="delivery-badge">Próxima Parada</div>
    
    <div class="pkg-row">
      <!-- Ícono de Caja SVG -->
      <svg class="pkg-icon" viewBox="0 0 24 24"><path d="M21 16.5l-9 5.25-9-5.25V7.5L12 2.25l9 5.25v9zM12 4.15L5.04 8.2 12 12.25l6.96-4.05L12 4.15zM4.5 9.87v5.76L11.25 19.5v-5.76L4.5 9.87zm15 0l-6.75 3.87v5.76L19.5 15.63V9.87z"/></svg>
      <div class="pkg-title" id="curPkg">#--</div>
    </div>

    <div class="address-title" id="curAddress">--</div>
    <div class="receiver-name" id="curName">--</div>

    <a id="btnMaps" class="btn btn-primary" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      Navegar con GPS
    </a>
    
    <button class="btn btn-success" onclick="marcarEntregado()">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      Entregado
    </button>
    
    <button class="btn btn-outline-danger" onclick="marcarNoEntregado()">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      No entregado / Problema
    </button>
  </div>

  <div id="nextSection" class="card" style="display: none;">
    <div class="section-title">Siguientes entregas</div>
    <div id="queueList"></div>
  </div>

  <div id="issuesSection" class="card" style="display: none; border-color: rgba(255, 69, 58, 0.3);">
    <div class="section-title" style="color: var(--danger);">Paquetes Aislados / Novedades</div>
    <div id="issuesList" style="font-size: 14px; line-height: 1.5;"></div>
  </div>
</div>

<script>
  let ruta = [];
  let currentIndex = 0;
  let entregadosCount = 0;
  let novedades = [];
  let proximidadAvisada = false;
  let fotosAcumuladas = [];

  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (val) {
      localStorage.setItem('gemini_api_key', val);
      document.getElementById('apiKeySection').style.display = 'none';
    }
  }

  window.onload = () => {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const keyFromUrl = hashParams.get('key');

    if (keyFromUrl) {
      localStorage.setItem('gemini_api_key', keyFromUrl);
      history.replaceState(null, "", window.location.pathname);
    }

    if (localStorage.getItem('gemini_api_key')) {
      const configBox = document.getElementById('apiKeySection');
      if (configBox) configBox.style.display = 'none';
    }

    iniciarGPSProximidad();
  };

  function setProgress(percent, text) {
    const pWrapper = document.getElementById('progressWrapper');
    const pFill = document.getElementById('progressFill');
    const pLabel = document.getElementById('progressLabel');
    pWrapper.style.display = 'block';
    pFill.style.width = percent + '%';
    pLabel.innerText = text;
  }

  function hablar(texto) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  function iniciarGPSProximidad() {
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(async (pos) => {
        if (ruta.length === 0 || currentIndex >= ruta.length || proximidadAvisada) return;
        const cur = ruta[currentIndex];
        if (!cur.lat || !cur.lng) return;

        const distMetros = calcularDistanciaMetros(pos.coords.latitude, pos.coords.longitude, cur.lat, cur.lng);
        if (distMetros <= 250 && !proximidadAvisada) {
          proximidadAvisada = true;
          hablar(`Atención. A doscientos metros del paquete ${cur.paquete}.`);
        }
      }, (err) => console.warn("GPS pasivo:", err), { enableHighAccuracy: true });
    }
  }

  function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const deltaPhi = (lat2 - lat1) * Math.PI / 180;
    const deltaLambda = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
              Math.cos(phi1) * Math.cos(phi2) *
              Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  async function agregarHoja(event) {
    const file = event.target.files[0];
    if (!file) return;

    const base64Image = await toBase64(file);
    const cleanedBase64 = base64Image.split(',')[1];
    const mimeType = file.type || 'image/jpeg';

    fotosAcumuladas.push({ inlineData: { mimeType, data: cleanedBase64 } });

    const scanStatus = document.getElementById('scanStatus');
    scanStatus.innerText = `📄 ${fotosAcumuladas.length} hoja(s) agregada(s) al lote`;
    scanStatus.style.display = 'block';

    document.getElementById('btnPhotoText').innerText = "📷 Agregar Otra Hoja";
    document.getElementById('addPhotoBtn').classList.remove('btn-primary');
    document.getElementById('addPhotoBtn').classList.add('btn-secondary');

    document.getElementById('btnProcessAll').style.display = 'inline-flex';
    event.target.value = "";
  }

  async function procesarTodasLasHojas() {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      alert("Por favor carga tu API Key primero.");
      return;
    }

    if (fotosAcumuladas.length === 0) return;

    document.getElementById('scanControls').style.display = 'none';
    setProgress(25, `Analizando ${fotosAcumuladas.length} hoja(s)...`);

    try {
      // Prompt logístico estricto: cercanía punto a punto y partición por vías de tren / zonas
      const prompt = `Analiza detalladamente todas las hojas de planilla adjuntas y extrae ABSOLUTAMENTE TODOS los paquetes listados.
Consolida todo en una sola lista JSON válida.

REGLAS ESTRICTAS DE ORDENAMIENTO LOGÍSTICO:
1. NO ordenes por número de paquete correlativo.
2. Agrupa primero por SECTORES GEOGRÁFICOS / LADOS DE LA VÍA DEL TREN (por ejemplo: entregar primero todo el lado Oeste/Sur de las vías y luego todo el lado Este/Norte, evitando cruzar las vías repetidas veces innecesariamente).
3. Dentro de cada sector, encadena las entregas por estricta cercanía física (algoritmo del vecino más cercano: de parada 1 a la más cercana 2, luego a la más cercana 3, etc.).
4. Marca "fueraDeZona": true si una dirección queda a más de 5 km del conglomerado principal.

Estructura de salida JSON (arreglo de objetos):
- "paquete": identificador o número (string)
- "remitente": nombre y apellido
- "direccion": calle, altura y localidad completa
- "fueraDeZona": booleano`;

      const parts = [{ text: prompt }, ...fotosAcumuladas];
      const requestBody = {
        contents: [{ parts }],
        generationConfig: { responseMimeType: "application/json" }
      };

      const modelsToTry = ["gemini-3.6-flash", "gemini-2.5-flash", "gemini-flash-latest"];
      let rawText = null;
      let lastError = null;

      for (const model of modelsToTry) {
        try {
          setProgress(70, `Optimizando por cercanía y sectores...`);
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            rawText = data.candidates[0].content.parts[0].text;
            break;
          }
        } catch (err) {
          lastError = err;
        }
      }

      if (!rawText) throw lastError || new Error("No se pudo procesar el lote.");

      const entregas = JSON.parse(rawText);
      setProgress(100, "¡Ruta consolidada!");
      setTimeout(() => {
        document.getElementById('progressWrapper').style.display = 'none';
        configurarRuta(entregas);
      }, 400);

    } catch (err) {
      alert("Aviso: " + err.message);
      document.getElementById('progressWrapper').style.display = 'none';
      document.getElementById('scanControls').style.display = 'block';
    }
  }

  function configurarRuta(entregas) {
    ruta = entregas.filter(e => !e.fueraDeZona);
    const descartados = entregas.filter(e => e.fueraDeZona);
    currentIndex = 0;
    entregadosCount = 0;
    proximidadAvisada = false;
    novedades = descartados.map(d => ({ ...d, motivo: "Fuera de zona (>5km)" }));

    if (ruta.length > 0) {
      const addresses = ruta.slice(0, 9).map(r => encodeURIComponent(r.direccion));
      const allMapsUrl = `https://www.google.com/maps/dir/${addresses.join('/')}`;
      const btnAll = document.getElementById('btnAllMaps');
      btnAll.href = allMapsUrl;
      btnAll.style.display = 'inline-flex';
    }

    renderNovedades();
    actualizarVista();
  }

  function renderNovedades() {
    if (novedades.length > 0) {
      const issuesList = document.getElementById('issuesList');
      issuesList.innerHTML = novedades.map(n => `
        <div style="margin-bottom: 8px;">
          <strong>#${n.paquete}</strong> • ${n.direccion}<br>
          <span style="color: var(--danger); font-size: 13px;">${n.motivo}</span>
        </div>
      `).join('');
      document.getElementById('issuesSection').style.display = 'block';
    }
  }

  function actualizarVista() {
    proximidadAvisada = false;
    const total = ruta.length;
    const restantes = total - currentIndex;

    if (currentIndex >= total && total > 0) {
      document.getElementById('currentCard').innerHTML = '<div style="text-align:center; font-size:20px; font-weight:700; padding:15px;">Jornada finalizada. Todas las paradas completadas.</div>';
      document.getElementById('nextSection').style.display = 'none';
      document.getElementById('summaryStrip').style.display = 'none';
      document.getElementById('btnAllMaps').style.display = 'none';
      hablar("Jornada completada. Muy buen trabajo.");
      return;
    }

    document.getElementById('summaryStrip').style.display = 'flex';
    document.getElementById('sumProgress').innerText = `${entregadosCount}/${total}`;
    
    const minutosTotales = restantes * 8;
    const ahora = new Date();
    const horaFin = new Date(ahora.getTime() + minutosTotales * 60000);
    document.getElementById('sumEta').innerText = horaFin.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' hs';

    const cur = ruta[currentIndex];
    // Solo numeral y número
    document.getElementById('curPkg').innerText = `#${cur.paquete}`;
    document.getElementById('curAddress').innerText = cur.direccion;
    document.getElementById('curName').innerText = cur.remitente;

    const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(cur.direccion)}`;
    document.getElementById('btnMaps').href = mapsUrl;
    document.getElementById('currentCard').style.display = 'block';

    const queueList = document.getElementById('queueList');
    const siguientes = ruta.slice(currentIndex + 1);
    if (siguientes.length > 0) {
      queueList.innerHTML = siguientes.map(s => `
        <div class="stop-row">
          <div class="stop-num">#${s.paquete}</div>
          <div class="stop-info">
            <div class="stop-addr">${s.direccion}</div>
            <div class="stop-person">${s.remitente}</div>
          </div>
        </div>
      `).join('');
      document.getElementById('nextSection').style.display = 'block';
    } else {
      document.getElementById('nextSection').style.display = 'none';
    }

    hablar(`Próxima parada, número ${cur.paquete}. En ${cur.direccion}`);
  }

  function marcarEntregado() {
    entregadosCount++;
    currentIndex++;
    actualizarVista();
  }

  function marcarNoEntregado() {
    const cur = ruta[currentIndex];
    const motivo = prompt("Motivo de la no entrega:\n1. Ausente / Nadie atiende\n2. Dirección incorrecta\n3. Rechazado", "Ausente / Nadie atiende");
    
    if (motivo !== null) {
      novedades.push({ ...cur, motivo: motivo });
      renderNovedades();
      currentIndex++;
      actualizarVista();
    }
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }
</script>
</body>
</html>
