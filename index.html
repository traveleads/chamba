<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Reparto Pro</title>
  <style>
    :root {
      --bg: #F4F4F6;
      --card-bg: #FFFFFF;
      --text-main: #1C1C1E;
      --text-muted: #8E8E93;
      --accent: #0A84FF;
      --accent-hover: #0071E3;
      --success: #30D158;
      --warning: #FF9F0A;
      --danger: #FF453A;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --btn-inner-light: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card-bg: #1C1C1E;
        --text-main: #F2F2F7;
        --text-muted: #98989D;
        --accent: #0A84FF;
        --accent-hover: #409CFF;
        --success: #32D74B;
        --warning: #FFD60A;
        --danger: #FF453A;
        --border-subtle: rgba(255, 255, 255, 0.12);
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        --btn-inner-light: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding: 18px; padding-bottom: 50px; }

    .container { max-width: 480px; margin: 0 auto; }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }

    .config-box { background: var(--card-bg); padding: 12px; border-radius: 14px; margin-bottom: 16px; border: 1px solid var(--border-subtle); }
    .config-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-subtle); font-size: 15px; outline: none; background: transparent; color: var(--text-main); }

    /* Tarjeta principal */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--card-shadow);
    }

    /* Botones de acción táctiles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      box-shadow: var(--btn-inner-light), 0 4px 12px rgba(0, 0, 0, 0.12);
      transition: transform 0.1s ease, filter 0.1s ease;
      margin-bottom: 10px;
    }
    .btn:active { transform: scale(0.98); filter: brightness(0.92); }
    
    .btn-primary { background: var(--accent); color: #FFFFFF; }
    .btn-success { background: var(--success); color: #FFFFFF; }
    .btn-maps { background: #5856D6; color: #FFFFFF; }
    .btn-outline-danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
      box-shadow: none;
    }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }
    input[type="file"] { display: none; }

    /* Barra de progreso simplificada */
    .progress-bar-container {
      display: none;
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
      text-align: center;
    }
    .progress-track { width: 100%; height: 8px; background: var(--border-subtle); border-radius: 4px; overflow: hidden; margin-top: 10px; }
    .progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }
    .progress-label { font-size: 14px; font-weight: 600; color: var(--accent); }

    /* Resumen de jornada limpio */
    .summary-strip {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
      font-size: 14px;
      font-weight: 500;
    }
    .summary-strip strong { color: var(--accent); font-weight: 700; }

    /* Enfoque actual */
    .delivery-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(10, 132, 255, 0.12);
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .pkg-title { font-size: 38px; font-weight: 800; letter-spacing: -1px; color: var(--text-main); margin-bottom: 4px; }
    .address-title { font-size: 21px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; color: var(--text-main); }
    .receiver-name { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; font-weight: 500; }

    /* Listas */
    .section-title { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stop-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .stop-row:last-child { border-bottom: none; }
    .stop-num { font-weight: 700; font-size: 16px; min-width: 50px; color: var(--text-muted); }
    .stop-info { flex: 1; }
    .stop-addr { font-weight: 600; font-size: 15px; }
    .stop-person { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Reparto Pro</h1>
  </div>

  <div class="config-box" id="apiKeySection">
    <input type="password" id="apiKeyInput" placeholder="Pegar Gemini API Key aquí" onchange="saveApiKey()" />
  </div>

  <label class="btn btn-primary" id="uploadLabel">
    <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
    Escanear Planilla Completa
    <input type="file" accept="image/*" capture="environment" onchange="procesarFoto(event)" />
  </label>

  <div id="progressWrapper" class="progress-bar-container">
    <div id="progressLabel" class="progress-label">Iniciando lectura...</div>
    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <!-- Resumen superior limpio -->
  <div id="summaryStrip" class="summary-strip">
    <div>Progreso: <strong id="sumProgress">0/0</strong></div>
    <div>Cierre est.: <strong id="sumEta">--:--</strong></div>
  </div>

  <a id="btnAllMaps" class="btn btn-maps" target="_blank" style="display: none;">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
    Ruta General en Maps
  </a>

  <!-- Tarjeta Entrega Actual -->
  <div id="currentCard" class="card" style="display: none;">
    <div class="delivery-badge">Próxima Parada</div>
    <div class="pkg-title" id="curPkg">#--</div>
    <div class="address-title" id="curAddress">--</div>
    <div class="receiver-name" id="curName">--</div>

    <a id="btnMaps" class="btn btn-primary" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      Navegar con GPS
    </a>
    
    <button class="btn btn-success" onclick="marcarEntregado()">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      Entregado
    </button>
    
    <button class="btn btn-outline-danger" onclick="marcarNoEntregado()">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      No entregado / Problema
    </button>
  </div>

  <!-- Siguientes Paradas -->
  <div id="nextSection" class="card" style="display: none;">
    <div class="section-title">Siguientes entregas</div>
    <div id="queueList"></div>
  </div>

  <!-- Novedades: No entregados y Fuera de zona -->
  <div id="issuesSection" class="card" style="display: none; border-color: rgba(255, 69, 58, 0.3);">
    <div class="section-title" style="color: var(--danger);">Paquetes Aislados / Novedades</div>
    <div id="issuesList" style="font-size: 14px; line-height: 1.5;"></div>
  </div>
</div>

<script>
  let ruta = [];
  let currentIndex = 0;
  let entregadosCount = 0;
  let novedades = [];

  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (val) {
      localStorage.setItem('gemini_api_key', val);
      document.getElementById('apiKeySection').style.display = 'none';
    }
  }

  window.onload = () => {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const keyFromUrl = hashParams.get('key');

    if (keyFromUrl) {
      localStorage.setItem('gemini_api_key', keyFromUrl);
      history.replaceState(null, "", window.location.pathname);
    }

    if (localStorage.getItem('gemini_api_key')) {
      const configBox = document.getElementById('apiKeySection');
      if (configBox) configBox.style.display = 'none';
    }
  };

  function setProgress(percent, text) {
    const pWrapper = document.getElementById('progressWrapper');
    const pFill = document.getElementById('progressFill');
    const pLabel = document.getElementById('progressLabel');
    pWrapper.style.display = 'block';
    pFill.style.width = percent + '%';
    pLabel.innerText = text;
  }

  function hablar(texto) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      window.speechSynthesis.speak(utterance);
    }
  }

  async function procesarFoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      alert("Por favor carga tu API Key primero.");
      return;
    }

    document.getElementById('uploadLabel').style.display = 'none';
    setProgress(20, "Escaneando filas de la planilla...");

    try {
      const base64Image = await toBase64(file);
      const cleanedBase64 = base64Image.split(',')[1];
      const mimeType = file.type || 'image/jpeg';

      setProgress(50, "Extrayendo todas las direcciones...");

      const prompt = `Analiza detalladamente esta planilla de reparto y extrae ABSOLUTAMENTE TODOS los paquetes o filas listadas. No omitas ninguno.
Devuelve un arreglo JSON válido donde cada elemento contenga:
- "paquete": identificador o número del paquete (string)
- "remitente": nombre y apellido de la persona
- "direccion": calle, altura y localidad completa
- "fueraDeZona": booleano (true si la dirección queda a más de 5 km o totalmente aislada del lote principal).

Ordena los paquetes válidos creando la secuencia de entrega más corta y lógica por calles y cercanía.`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { 
                inlineData: { 
                  mimeType: mimeType, 
                  data: cleanedBase64 
                } 
              }
            ]
          }],
          generationConfig: {
            responseMimeType: "application/json"
          }
        })
      });

      setProgress(85, "Organizando secuencia de paradas...");

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || "Error al procesar");

      const rawText = data.candidates[0].content.parts[0].text;
      const entregas = JSON.parse(rawText);

      setProgress(100, "Ruta generada");
      setTimeout(() => {
        document.getElementById('progressWrapper').style.display = 'none';
        configurarRuta(entregas);
      }, 400);

    } catch (err) {
      alert("Error: " + err.message);
      document.getElementById('progressWrapper').style.display = 'none';
      document.getElementById('uploadLabel').style.display = 'inline-flex';
    }
  }

  function configurarRuta(entregas) {
    ruta = entregas.filter(e => !e.fueraDeZona);
    const descartados = entregas.filter(e => e.fueraDeZona);
    currentIndex = 0;
    entregadosCount = 0;
    novedades = descartados.map(d => ({ ...d, motivo: "Fuera de zona (>5km)" }));

    if (ruta.length > 0) {
      const addresses = ruta.slice(0, 9).map(r => encodeURIComponent(r.direccion));
      const allMapsUrl = `https://www.google.com/maps/dir/${addresses.join('/')}`;
      const btnAll = document.getElementById('btnAllMaps');
      btnAll.href = allMapsUrl;
      btnAll.style.display = 'inline-flex';
    }

    renderNovedades();
    actualizarVista();
  }

  function renderNovedades() {
    if (novedades.length > 0) {
      const issuesList = document.getElementById('issuesList');
      issuesList.innerHTML = novedades.map(n => `
        <div style="margin-bottom: 8px;">
          <strong>#${n.paquete}</strong> • ${n.direccion}<br>
          <span style="color: var(--danger); font-size: 13px;">${n.motivo}</span>
        </div>
      `).join('');
      document.getElementById('issuesSection').style.display = 'block';
    }
  }

  function actualizarVista() {
    const total = ruta.length;
    const restantes = total - currentIndex;

    if (currentIndex >= total && total > 0) {
      document.getElementById('currentCard').innerHTML = '<div style="text-align:center; font-size:20px; font-weight:700; padding:15px;">Jornada finalizada. Todas las paradas completadas.</div>';
      document.getElementById('nextSection').style.display = 'none';
      document.getElementById('summaryStrip').style.display = 'none';
      document.getElementById('btnAllMaps').style.display = 'none';
      hablar("Jornada completada. Muy buen trabajo.");
      return;
    }

    // Actualiza la barra superior limpia
    document.getElementById('summaryStrip').style.display = 'flex';
    document.getElementById('sumProgress').innerText = `${entregadosCount}/${total}`;
    
    // Cálculo: 8 minutos promedio por paquete restante
    const minutosTotales = restantes * 8;
    const ahora = new Date();
    const horaFin = new Date(ahora.getTime() + minutosTotales * 60000);
    document.getElementById('sumEta').innerText = horaFin.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' hs';

    const cur = ruta[currentIndex];
    document.getElementById('curPkg').innerText = `#${cur.paquete}`;
    document.getElementById('curAddress').innerText = cur.direccion;
    document.getElementById('curName').innerText = cur.remitente;

    const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(cur.direccion)}`;
    document.getElementById('btnMaps').href = mapsUrl;
    document.getElementById('currentCard').style.display = 'block';

    const queueList = document.getElementById('queueList');
    const siguientes = ruta.slice(currentIndex + 1);
    if (siguientes.length > 0) {
      queueList.innerHTML = siguientes.map(s => `
        <div class="stop-row">
          <div class="stop-num">#${s.paquete}</div>
          <div class="stop-info">
            <div class="stop-addr">${s.direccion}</div>
            <div class="stop-person">${s.remitente}</div>
          </div>
        </div>
      `).join('');
      document.getElementById('nextSection').style.display = 'block';
    } else {
      document.getElementById('nextSection').style.display = 'none';
    }

    hablar(`Próxima parada, paquete ${cur.paquete}. En ${cur.direccion}`);
  }

  function marcarEntregado() {
    entregadosCount++;
    currentIndex++;
    actualizarVista();
  }

  function marcarNoEntregado() {
    const cur = ruta[currentIndex];
    const motivo = prompt("Motivo de la no entrega:\n1. Ausente / Nadie atiende\n2. Dirección incorrecta\n3. Rechazado", "Ausente / Nadie atiende");
    
    if (motivo !== null) {
      novedades.push({ ...cur, motivo: motivo });
      renderNovedades();
      currentIndex++;
      actualizarVista();
    }
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }
</script>
</body>
</html>
